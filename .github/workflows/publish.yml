name: Publish package

on:
    push:
        branches: [main]
        paths:
            - package.json

permissions:
    contents: write
    id-token: write

concurrency:
    group: npm-release
    cancel-in-progress: false

jobs:
    publish:
        name: Tag, release, and publish
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Detect version change
              id: version
              env:
                  BEFORE_SHA: ${{ github.event.before }}
              run: |
                  current_version=$(node -p "require('./package.json').version")
                  previous_version=""

                  if git cat-file -e "$BEFORE_SHA:package.json" 2>/dev/null; then
                      previous_version=$(git show "$BEFORE_SHA:package.json" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version))")
                  fi

                  if [ "$current_version" = "$previous_version" ]; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  echo "version=$current_version" >> "$GITHUB_OUTPUT"
                  echo "tag=v$current_version" >> "$GITHUB_OUTPUT"

            - name: Set up Node.js
              if: steps.version.outputs.changed == 'true'
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Install dependencies
              if: steps.version.outputs.changed == 'true'
              run: npm ci

            - name: Typecheck
              if: steps.version.outputs.changed == 'true'
              run: npm run typecheck

            - name: Build package
              if: steps.version.outputs.changed == 'true'
              run: npm run build

            - name: Ensure tag is new
              if: steps.version.outputs.changed == 'true'
              env:
                  TAG: ${{ steps.version.outputs.tag }}
              run: test -z "$(git ls-remote --tags origin "refs/tags/$TAG")"

            - name: Create tag and GitHub Release
              if: steps.version.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.version.outputs.tag }}
              run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes

            - name: Publish package
              if: steps.version.outputs.changed == 'true'
              run: npm publish --access public
