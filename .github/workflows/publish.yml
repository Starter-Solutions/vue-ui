name: Publish npm package

on:
    push:
        branches:
            - main
        paths:
            - package.json
            - .github/workflows/publish.yml
    pull_request:
        paths:
            - package.json
            - package-lock.json
            - src/**
            - vite.config.ts
            - .github/workflows/publish.yml
    workflow_dispatch:

concurrency:
    group: publish-vue-ui-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    id-token: write

jobs:
    test-and-publish:
        name: Test and publish
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Build package
              run: npm run build

            - name: Validate package contents
              run: npm pack --dry-run

            - name: Check whether version exists
              id: version
              shell: bash
              run: |
                  package_name=$(node --print "require('./package.json').name")
                  package_version=$(node --print "require('./package.json').version")

                  echo "name=$package_name" >> "$GITHUB_OUTPUT"
                  echo "version=$package_version" >> "$GITHUB_OUTPUT"
                  echo "tag=v$package_version" >> "$GITHUB_OUTPUT"

                  if npm view "$package_name@$package_version" version --json > /dev/null 2>&1; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                      echo "$package_name@$package_version is already published."
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                      echo "$package_name@$package_version will be published."
                  fi

            - name: Publish package
              if: github.event_name != 'pull_request' && steps.version.outputs.exists == 'false'
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create tag and GitHub Release
              if: github.event_name != 'pull_request'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  if gh release view "$TAG" > /dev/null 2>&1; then
                      echo "Release $TAG already exists."
                  elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
                      gh release create "$TAG" --verify-tag --generate-notes
                  else
                      gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
                  fi

            - name: Report existing version
              if: steps.version.outputs.exists == 'true'
              run: echo "${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }} is already available on npm."
